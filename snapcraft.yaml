name: binwalk
title: binwalk
contact:
  - https://github.com/alexmurray/binwalk-snap/issues
base: core24
version: 3.1.0
summary: Firmware Analysis Tool
description: |
  This is an updated version of the Binwalk firmware analysis tool, re-written
  in Rust for speed and accuracy.

license: MIT
grade: stable
confinement: strict
platforms:
  # we are limited by what sasquatch provides
  amd64:
  arm64:
  armhf:

apps:
  binwalk:
    command: bin/binwalk
    plugs:
      - home
      - removable-media

parts:
  sasquatch:
    plugin: nil
    build-packages:
      - wget
    override-build: |
      wget https://github.com/onekey-sec/sasquatch/releases/download/sasquatch-v4.5.1-5/sasquatch_1.0_${CRAFT_ARCH_BUILD_FOR}.deb
      dpkg-deb -x sasquatch_1.0_${CRAFT_ARCH_BUILD_FOR}.deb $CRAFT_PART_INSTALL/

  python-deps:
    plugin: python
    source: https://github.com/ReFirmLabs/binwalk.git
    python-requirements:
      - dependencies/requirements.txt

  dumpifs:
    plugin: make
    source: https://github.com/askac/dumpifs.git
    override-pull: |
      craftctl default
      # fix missing includes
      for op in dec enc; do
        echo '#include <string.h>' > fix${op}ifs.c.tmp
        cat fix${op}ifs.c >> fix${op}ifs.c.tmp
        mv fix${op}ifs.c.tmp fix${op}ifs.c
      done
    override-build: |
      make dumpifs
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp dumpifs $SNAPCRAFT_PART_INSTALL/bin
    stage-packages:
      - libucl1

  lzfse:
    plugin: make
    source: https://github.com/lzfse/lzfse.git

  dmg2img:
    after: [lzfse]
    plugin: make
    source: https://github.com/Lekensteyn/dmg2img.git
    make-parameters:
      - HAVE_LZFSE=1

  binwalk:
    after: [sasquatch, python-deps, dmg2img, dumpifs]
    plugin: rust
    source: https://github.com/ReFirmLabs/binwalk.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - build-essential
      - clang
      - curl
      - git
      - libbz2-dev
      - libfontconfig1-dev
      - liblz4-dev
      - liblzma-dev
      - liblzo2-dev
      - libssl-dev
      - libucl-dev
      - python3-pip
      - wget
      - zlib1g-dev
    stage-packages:
      - 7zip
      - 7zip-rar
      - 7zip-standalone
      - cabextract
      - cpio
      - device-tree-compiler
      - libfontconfig1
      - lz4
      - lzop
      - sleuthkit
      - srecord
      - tar
      - unrar
      - unyaffs
      - unzip
      - zstd
    override-prime: |
      craftctl default
      # fixup path in 7zip tools
      sed -i 's|exec /usr|exec $SNAP/usr|' $CRAFT_PRIME/usr/bin/7z*

